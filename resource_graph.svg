<!-- Secrets card -->
<rect x="130" y="290" width="130" height="130" rx="10" fill="#fff8e1" stroke="#ffcc80" stroke-width="0.8"/>
<rect x="153" y="306" width="84" height="72" rx="8" fill="#e65100"/>
<rect x="173" y="336" width="44" height="30" rx="5" fill="#fff" opacity="0.95"/>
<path d="M177 336 Q177 320 195 320 Q213 320 213 336" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<circle cx="195" cy="351" r="5" fill="#ff8f00"/>
<line x1="195" y1="356" x2="195" y2="362" stroke="#ff8f00" stroke-width="2.5" stroke-linecap="round"/>
<text class="th" x="195" y="398" text-anchor="middle">Secrets</text>
<text class="ts" x="195" y="413" text-anchor="middle">Manager</text>
<!-- SSM card -->
<rect x="275" y="290" width="130" height="130" rx="10" fill="#fdecea" stroke="#f5a8a5" stroke-width="0.8"/>
<rect x="298" y="306" width="84" height="72" rx="8" fill="#c62828"/>
<path d="M340 314 L368 322 L368 340 Q368 358 340 366 Q312 358 312 340 L312 322 Z" fill="#fff" opacity="0.95"/>
<line x1="328" y1="340" x2="336" y2="350" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
<line x1="336" y1="350" x2="354" y2="330" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
<text class="th" x="340" y="398" text-anchor="middle">SSM</text>
<text class="ts" x="340" y="413" text-anchor="middle">No SSH access</text>
<!-- Terraform card -->
<rect x="420" y="290" width="130" height="130" rx="10" fill="#ede7f6" stroke="#b39ddb" stroke-width="0.8"/>
<rect x="443" y="306" width="84" height="72" rx="8" fill="#4527a0"/>
<polygon points="485,318 463,358 485,346" fill="#fff" opacity="0.95"/>
<polygon points="485,318 507,358 485,346" fill="#fff" opacity="0.65"/>
<text class="th" x="485" y="398" text-anchor="middle">Terraform</text>
<text class="ts" x="485" y="413" text-anchor="middle">GitHub Actions</text>
<text class="footer" x="340" y="503" text-anchor="middle">Secure tiered networking · private backends · isolated DB · managed secrets · automated IaC</text>
</svg>
