<circle cx="122" cy="156" r="13" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
<line x1="122" y1="128" x2="122" y2="143" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<line x1="122" y1="169" x2="122" y2="184" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<line x1="94" y1="156" x2="109" y2="156" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<line x1="135" y1="156" x2="150" y2="156" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<text class="th" x="122" y="218" text-anchor="middle">ALB + NAT</text>
<text class="ts" x="122" y="236" text-anchor="middle">Public subnets</text>
<!-- Arrow HTTP/S -->
<line x1="198" y1="174" x2="248" y2="174" stroke="#EF9F27" stroke-width="1.8" marker-end="url(#arr)"/>
<text class="subtitle" x="223" y="165" text-anchor="middle">HTTP/S</text>
<!-- EC2 card -->
<rect x="262" y="95" width="148" height="158" rx="10" fill="#f0e8fc" stroke="#c89cf0" stroke-width="0.8"/>
<rect x="286" y="112" width="100" height="88" rx="8" fill="#7b1fa2"/>
<rect x="299" y="126" width="74" height="16" rx="4" fill="#fff" opacity="0.9"/>
<rect x="299" y="148" width="74" height="16" rx="4" fill="#fff" opacity="0.9"/>
<rect x="299" y="170" width="74" height="16" rx="4" fill="#fff" opacity="0.9"/>
<circle cx="309" cy="134" r="3" fill="#ce93d8"/>
<circle cx="309" cy="156" r="3" fill="#ce93d8"/>
<circle cx="309" cy="178" r="3" fill="#ce93d8"/>
