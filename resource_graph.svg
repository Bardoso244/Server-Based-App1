<ellipse cx="550" cy="134" rx="28" ry="9" fill="#fff" opacity="0.9"/>
<rect x="522" y="134" width="56" height="38" fill="#fff" opacity="0.75"/>
<ellipse cx="550" cy="172" rx="28" ry="9" fill="#fff" opacity="0.9"/>
<line x1="530" y1="148" x2="570" y2="148" stroke="#00695c" stroke-width="1.2" opacity="0.5"/>
<line x1="530" y1="160" x2="570" y2="160" stroke="#00695c" stroke-width="1.2" opacity="0.5"/>
<text class="th" x="550" y="218" text-anchor="middle">RDS MySQL</text>
